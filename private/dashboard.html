<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petshop Manager | Área administrativa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <strong>Petshop Manager</strong>
    <nav>
        <a href="index.html">Cadastro</a>
        <a href="dashboard">Área administrativa</a>
    </nav>
</header>

<main class="dashboard-main">
    <section class="dashboard-head">
        <div>
            <h1>Bem-vindo à área administrativa</h1>
            <p class="sub">Acompanhe os atendimentos e exporte o relatório.</p>
        </div>
        <div class="dashboard-actions">
            <button type="button" id="gerarPDF">Gerar PDF</button>
            <button type="button" id="logout" class="button-secondary">Sair</button>
        </div>
    </section>

    <section class="chart-card">
        <div class="chart-card-header">
            <div>
                <span class="chart-eyebrow">Resumo geral</span>
                <h2>Gráficos dos atendimentos</h2>
            </div>
        </div>
        <div class="chart-wrapper">
            <img id="grafico" alt="Gráficos de atendimento">
        </div>
    </section>
</main>
    <script src="dashboard.js"></script>
</body>
</html>
